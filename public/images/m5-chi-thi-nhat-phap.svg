<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241913" />
      <stop offset="50%" stop-color="#1b120c" />
      <stop offset="100%" stop-color="#100a06" />
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b98b4a" />
      <stop offset="50%" stop-color="#e8cf96" />
      <stop offset="100%" stop-color="#b98b4a" />
    </linearGradient>
    <linearGradient id="redGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f2418" />
      <stop offset="100%" stop-color="#5a140d" />
    </linearGradient>
  </defs>

  <!-- Nền giấy vintage trầm bảo tàng -->
  <rect width="800" height="500" fill="url(#bgGrad5)" />

  <!-- Viền đôi phong cách bảo tàng -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#b98b4a" stroke-width="1.5" stroke-opacity="0.45" rx="4" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#8f2418" stroke-width="1" stroke-opacity="0.3" rx="2" />

  <!-- Họa tiết góc cổ điển -->
  <path d="M 24 48 L 48 48 L 48 24" fill="none" stroke="#b98b4a" stroke-width="2.5" />
  <path d="M 776 48 L 752 48 L 752 24" fill="none" stroke="#b98b4a" stroke-width="2.5" />
  <path d="M 24 452 L 48 452 L 48 476" fill="none" stroke="#b98b4a" stroke-width="2.5" />
  <path d="M 776 452 L 752 452 L 752 476" fill="none" stroke="#b98b4a" stroke-width="2.5" />

  <!-- Tag sự kiện then chốt -->
  <rect x="270" y="55" width="260" height="28" rx="14" fill="url(#redGrad5)" />
  <text x="400" y="74" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="700" fill="#fff9ee" text-anchor="middle" letter-spacing="2">
    VĂN KIỆN LỊCH SỬ 12/3/1945
  </text>

  <!-- Biểu tượng trung tâm: Cuộn văn kiện chỉ thị & ngọn đuốc -->
  <circle cx="400" cy="180" r="56" fill="#261b14" stroke="url(#goldGrad5)" stroke-width="2" />
  <circle cx="400" cy="180" r="48" fill="#1b120c" stroke="#8f2418" stroke-width="1.5" />
  <text x="400" y="196" font-size="40" text-anchor="middle">📜</text>

  <!-- Tiêu đề văn kiện -->
  <text x="400" y="275" font-family="'Playfair Display', Georgia, serif" font-size="21" font-weight="800" fill="url(#goldGrad5)" text-anchor="middle" letter-spacing="1">
    CHỈ THỊ LỊCH SỬ
  </text>
  <text x="400" y="305" font-family="'Playfair Display', Georgia, serif" font-size="16" font-style="italic" fill="#fff9ee" text-anchor="middle">
    “Nhật – Pháp bắn nhau và hành động của chúng ta”
  </text>

  <!-- Đường kẻ trang trí vàng đồng -->
  <line x1="240" y1="330" x2="560" y2="330" stroke="url(#goldGrad5)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Chú thích chi tiết -->
  <text x="400" y="365" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13.5" fill="#e8cf96" text-anchor="middle">
    Ban Thường vụ Trung ương Đảng họp tại Đình Bảng (Từ Sơn, Bắc Ninh)
  </text>
  <text x="400" y="392" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" fill="#a48c78" text-anchor="middle">
    Xác định phát xít Nhật là kẻ thù chính, phát động cao trào kháng Nhật cứu nước
  </text>

  <!-- Dấu bảo tàng -->
  <rect x="290" y="420" width="220" height="24" rx="4" fill="none" stroke="#b98b4a" stroke-width="1" stroke-dasharray="4,4" />
  <text x="400" y="436" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="#b98b4a" text-anchor="middle" letter-spacing="1">
    TƯ LIỆU VĂN KIỆN ĐẢNG 1945
  </text>
</svg>
