<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1930" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281710" />
      <stop offset="50%" stop-color="#1e110b" />
      <stop offset="100%" stop-color="#120805" />
    </linearGradient>
    <linearGradient id="goldGrad1930" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b98b4a" />
      <stop offset="50%" stop-color="#f0dca2" />
      <stop offset="100%" stop-color="#b98b4a" />
    </linearGradient>
    <linearGradient id="redGrad1930" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a2417" />
      <stop offset="100%" stop-color="#60130b" />
    </linearGradient>
  </defs>

  <!-- Nền giấy vintage trầm bảo tàng -->
  <rect width="800" height="500" fill="url(#bgGrad1930)" />

  <!-- Viền đôi bảo tàng -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#b98b4a" stroke-width="1.5" stroke-opacity="0.45" rx="4" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#8f2418" stroke-width="1" stroke-opacity="0.35" rx="2" />

  <!-- Họa tiết góc cổ điển -->
  <path d="M 24 48 L 48 48 L 48 24" fill="none" stroke="#b98b4a" stroke-width="2.5" />
  <path d="M 776 48 L 752 48 L 752 24" fill="none" stroke="#b98b4a" stroke-width="2.5" />
  <path d="M 24 452 L 48 452 L 48 476" fill="none" stroke="#b98b4a" stroke-width="2.5" />
  <path d="M 776 452 L 752 452 L 752 476" fill="none" stroke="#b98b4a" stroke-width="2.5" />

  <!-- Tag sự kiện -->
  <rect x="260" y="52" width="280" height="30" rx="15" fill="url(#redGrad1930)" />
  <text x="400" y="72" font-family="'Playfair Display', Georgia, serif" font-size="12.5" font-weight="700" fill="#fff9ee" text-anchor="middle" letter-spacing="2">
    BƯỚC NGOẶT VĨ ĐẠI 1930
  </text>

  <!-- Biểu tượng trung tâm: Búa liềm & Cương lĩnh đầu tiên -->
  <circle cx="400" cy="180" r="58" fill="#2c1a11" stroke="url(#goldGrad1930)" stroke-width="2" />
  <circle cx="400" cy="180" r="50" fill="#1b100a" stroke="#8f2418" stroke-width="1.5" />
  <text x="400" y="196" font-size="40" text-anchor="middle">☭</text>

  <!-- Tiêu đề tư liệu -->
  <text x="400" y="275" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="800" fill="url(#goldGrad1930)" text-anchor="middle" letter-spacing="1">
    HỘI NGHỊ THÀNH LẬP ĐẢNG
  </text>
  <text x="400" y="306" font-family="'Playfair Display', Georgia, serif" font-size="16" font-style="italic" fill="#fff9ee" text-anchor="middle">
    Cửu Long (Hương Cảng, Trung Quốc) · Mùa xuân 1930
  </text>

  <!-- Đường kẻ trang trí vàng đồng -->
  <line x1="240" y1="330" x2="560" y2="330" stroke="url(#goldGrad1930)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Chú thích chi tiết -->
  <text x="400" y="365" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="13.5" fill="#e8cf96" text-anchor="middle">
    Chủ trì: Lãnh tụ Nguyễn Ái Quốc (đại diện Quốc tế Cộng sản)
  </text>
  <text x="400" y="392" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="12.5" fill="#a48c78" text-anchor="middle">
    Hợp nhất ba tổ chức cộng sản, thông qua Chánh cương và Sách lược vắn tắt
  </text>

  <!-- Dấu bảo tàng -->
  <rect x="280" y="420" width="240" height="24" rx="4" fill="none" stroke="#b98b4a" stroke-width="1" stroke-dasharray="4,4" />
  <text x="400" y="436" font-family="'Be Vietnam Pro', system-ui, sans-serif" font-size="11" fill="#b98b4a" text-anchor="middle" letter-spacing="1">
    TƯ LIỆU LỊCH SỬ ĐẢNG 1930
  </text>
</svg>
