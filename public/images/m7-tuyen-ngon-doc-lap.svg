<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sepiaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1C13" />
      <stop offset="50%" stop-color="#3D261A" />
      <stop offset="100%" stop-color="#1F120B" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8F2418" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#sepiaBg)" />
  <circle cx="400" cy="220" r="280" fill="url(#goldGlow)" />

  <!-- Outer Double Archival Border -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#B98B4A" stroke-width="1.5" stroke-opacity="0.6" rx="4" />
  <rect x="32" y="32" width="736" height="436" fill="none" stroke="#B98B4A" stroke-width="0.8" stroke-dasharray="4 3" stroke-opacity="0.4" rx="2" />

  <!-- Decorative Corner Accents -->
  <path d="M 40 54 L 40 40 L 54 40" fill="none" stroke="#B98B4A" stroke-width="2" />
  <path d="M 760 54 L 760 40 L 746 40" fill="none" stroke="#B98B4A" stroke-width="2" />
  <path d="M 40 446 L 40 460 L 54 460" fill="none" stroke="#B98B4A" stroke-width="2" />
  <path d="M 760 446 L 760 460 L 746 460" fill="none" stroke="#B98B4A" stroke-width="2" />

  <!-- Center Historical Emblem / Star -->
  <g transform="translate(400, 160)">
    <!-- Golden Star -->
    <path d="M 0 -45 L 13 -13 L 45 -13 L 20 7 L 30 40 L 0 20 L -30 40 L -20 7 L -45 -13 L -13 -13 Z" fill="#E5C158" opacity="0.92" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.5))" />
    <circle cx="0" cy="0" r="58" fill="none" stroke="#B98B4A" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="3 3" />
  </g>

  <!-- Historical Label & Date -->
  <text x="400" y="270" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#FFF9EE" letter-spacing="3">
    QUẢNG TRƯỜNG BA ĐÌNH
  </text>
  <text x="400" y="306" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="600" fill="#E5C158" letter-spacing="4">
    NGÀY 02 THÁNG 09 NĂM 1945
  </text>

  <!-- Divider Line with Diamond -->
  <line x1="280" y1="330" x2="385" y2="330" stroke="#B98B4A" stroke-width="1" stroke-opacity="0.5" />
  <polygon points="400,326 404,330 400,334 396,330" fill="#E5C158" />
  <line x1="415" y1="330" x2="520" y2="330" stroke="#B98B4A" stroke-width="1" stroke-opacity="0.5" />

  <!-- Historic Quote Line -->
  <text x="400" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-style="italic" fill="#EEDDBB" opacity="0.85">
    “Nước Việt Nam có quyền hưởng tự do và độc lập, và sự thật đã thành một nước tự do, độc lập.”
  </text>

  <text x="400" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#B98B4A" letter-spacing="1.5" opacity="0.75">
    ✦ LỄ ĐỘC LẬP KHAI SINH NƯỚC VIỆT NAM DÂN CHỦ CỘNG HÒA ✦
  </text>
</svg>
